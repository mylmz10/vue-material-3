name: release-please

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      simulate_publish_failure:
        description: Simulate npm publish failure (for rollback test)
        required: false
        default: false
        type: boolean
      reconcile_tag:
        description: "Reconcile an already-created release tag (example: v0.9.0)"
        required: false
        default: ''
        type: string

jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  release-please-pr:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.reconcile_tag == '' && inputs.simulate_publish_failure == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      deploy_sha: ${{ steps.deploy-source.outputs.sha }}
    steps:
      - name: Checkout repository
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: release
        uses: GoogleCloudPlatform/release-please-action@v4
        with:
          include-component-in-tag: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize release outputs
        id: release-meta
        env:
          OUTPUTS_JSON: ${{ toJSON(steps.release.outputs) }}
        run: |
          printf '%s\n' "${OUTPUTS_JSON}" > /tmp/release-please-outputs.json

          RELEASE_CREATED=$(jq -r '[
            .release_created,
            .releases_created,
            .[".--release_created"],
            (to_entries[] | select(.key | endswith("--release_created")) | .value)
          ]
          | map(select(. != null and . != ""))
          | map(ascii_downcase)
          | if any(. == "true") then "true" else "false" end' /tmp/release-please-outputs.json)

          TAG_NAME=$(jq -r '[
            .tag_name,
            .[".--tag_name"],
            (to_entries[] | select(.key | endswith("--tag_name")) | .value)
          ]
          | map(select(. != null and . != ""))
          | .[0] // ""' /tmp/release-please-outputs.json)

          RELEASE_SHA=$(jq -r '[
            .sha,
            .[".--sha"],
            (to_entries[] | select(.key | endswith("--sha")) | .value)
          ]
          | map(select(. != null and . != ""))
          | .[0] // ""' /tmp/release-please-outputs.json)

          echo "release_created=${RELEASE_CREATED}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

          echo "release_created=${RELEASE_CREATED}"
          echo "tag_name=${TAG_NAME}"
          echo "sha=${RELEASE_SHA}"

      - name: Resolve manual release commit
        id: manual-release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "created=false" >> "${GITHUB_OUTPUT}"
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              git fetch origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
              RELEASE_SHA=$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")
              echo "ready=true" >> "${GITHUB_OUTPUT}"
              echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
              echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
            else
              echo "ready=false" >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          fi

          echo "created=true" >> "${GITHUB_OUTPUT}"
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release for manual release
        if: ${{ steps.release-meta.outputs.release_created != 'true' && steps.manual-release.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.manual-release.outputs.tag_name }}
        run: |
          awk '/^## \[/{section++} section == 1 {print} section == 2 {exit}' CHANGELOG.md > /tmp/release-notes.md
          gh release create "${TAG_NAME}" --target "${GITHUB_SHA}" --title "${TAG_NAME}" --notes-file /tmp/release-notes.md

      - name: Checkout release commit
        uses: actions/checkout@v4
        if: ${{ steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true' }}
        with:
          fetch-depth: 0
          ref: ${{ steps.release-meta.outputs.sha || steps.manual-release.outputs.sha }}

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
        if: ${{ steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true' }}

      - name: Verify release source and version
        if: ${{ steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true' }}
        env:
          RELEASE_SHA: ${{ steps.release-meta.outputs.sha || steps.manual-release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag_name || steps.manual-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SHA}" ] || [ -z "${RELEASE_TAG}" ]; then
            echo "::error::Release SHA and tag are required."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ] || [ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "${RELEASE_SHA}" ]; then
            echo "::error::Checked-out source and release tag must match the release SHA."
            exit 1
          fi

          VERSION=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "::error::Package version ${VERSION} does not match release tag ${RELEASE_TAG}."
            exit 1
          fi

      - name: Ensure npm 11.5.1+
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version
        if: ${{ steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true' }}

      - name: Install dependencies
        run: npm ci
        if: ${{ steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true' }}

      - name: Validate release
        if: ${{ steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true' }}
        run: |
          npm test
          npm run lint:check

      - name: Check npm publication
        id: npm-publication
        if: ${{ steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true' }}
        env:
          TAG_NAME: ${{ steps.release-meta.outputs.tag_name || steps.manual-release.outputs.tag_name }}
        run: &check-npm-publication |
          set -euo pipefail
          if [ -n "${RELEASE_REVISION:-}" ]; then
            RELEASE_PACKAGE=$(git show "${RELEASE_REVISION}:package.json")
          else
            RELEASE_PACKAGE=$(cat package.json)
          fi
          PACKAGE_NAME=$(printf '%s' "$RELEASE_PACKAGE" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).name')
          VERSION=$(printf '%s' "$RELEASE_PACKAGE" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          if [ "$TAG_NAME" != "v$VERSION" ] || [ -z "$PACKAGE_NAME" ] || [ "$PACKAGE_NAME" = undefined ]; then
            echo "::error::Release package identity does not match tag ${TAG_NAME}."
            exit 1
          fi
          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT
          if npm view "${PACKAGE_NAME}@${VERSION}" version --json --prefer-online --registry=https://registry.npmjs.org > "$RESPONSE" 2>/dev/null; then
            node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); process.exit(value === process.argv[1] ? 0 : 1)' "$VERSION" "$RESPONSE"
            echo "published=true" >> "$GITHUB_OUTPUT"
            if [ "${REQUIRE_UNPUBLISHED:-false}" = true ]; then
              echo "::error::${PACKAGE_NAME}@${VERSION} is already published. Release metadata was preserved."
              exit 1
            fi
          elif node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(value.error?.code === "E404" ? 0 : 1)' "$RESPONSE"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not establish npm publication status."
            exit 1
          fi

      - name: Publish package on NPM 📦
        id: publish
        continue-on-error: true
        if: ${{ (steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true') && steps.npm-publication.outputs.published == 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.simulate_publish_failure }}" = "true" ]; then
            echo "Simulating publish failure."
            exit 1
          fi

          npm publish --access public

      - name: Resolve Pages deployment source
        id: deploy-source
        if: ${{ (steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true') && (steps.publish.outcome == 'success' || steps.npm-publication.outputs.published == 'true') }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Recheck npm publication before rollback
        id: rollback-publication
        if: ${{ (steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true') && steps.publish.outcome == 'failure' }}
        env:
          TAG_NAME: ${{ steps.release-meta.outputs.tag_name || steps.manual-release.outputs.tag_name }}
          REQUIRE_UNPUBLISHED: 'true'
        run: *check-npm-publication

      - name: Roll back failed release by opening PR
        if: ${{ steps.publish.outcome == 'failure' && steps.rollback-publication.outputs.published == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release-meta.outputs.tag_name || steps.manual-release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release-meta.outputs.sha || steps.manual-release.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Publish failed for ${TAG_NAME}. Cleaning release metadata and opening rollback PR."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout master
          git reset --hard origin/master

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release delete "${TAG_NAME}" --yes
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG_NAME}"
          fi

          TAG_SAFE="${TAG_NAME//./-}"
          TAG_SAFE="${TAG_SAFE//\//-}"
          BRANCH_NAME="ci/rollback-${TAG_SAFE}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH_NAME}"

          if ! git revert --no-edit "${RELEASE_SHA}"; then
            git revert --abort || true
            git revert -m 1 --no-edit "${RELEASE_SHA}"
          fi

          git commit --amend -m "chore(ci): rollback failed release ${TAG_NAME}"
          git push origin "${BRANCH_NAME}"

          PR_TITLE="chore(ci): rollback failed release ${TAG_NAME}"
          PR_BODY=$(printf 'npm publish failed for %s in run https://github.com/%s/actions/runs/%s.\nThis PR reverts release commit %s to keep master aligned with npm.\n' "${TAG_NAME}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${RELEASE_SHA}")

          PR_URL=""
          if ! PR_URL=$(gh pr create \
            --base master \
            --head "${BRANCH_NAME}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}"); then
            PR_URL=$(gh pr list \
              --head "${BRANCH_NAME}" \
              --base master \
              --state open \
              --json url \
              --jq '.[0].url // empty')
          fi

          if [ -z "${PR_URL}" ]; then
            echo "Failed to create or resolve rollback PR."
            exit 1
          fi

          echo "Opened rollback PR: ${PR_URL}"

          if ! gh pr merge "${PR_URL}" --auto --merge; then
            echo "Auto-merge could not be enabled. Merge rollback PR manually."
          fi

      - name: Mark workflow as failed after rollback
        if: ${{ (steps.release-meta.outputs.release_created == 'true' || steps.manual-release.outputs.ready == 'true') && steps.publish.outcome == 'failure' }}
        run: |
          echo "Publish failed. Rollback PR was created."
          exit 1

  deploy-release:
    needs: release-please-pr
    if: ${{ needs.release-please-pr.outputs.deploy_sha != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-storybook.yml
    with:
      release_sha: ${{ needs.release-please-pr.outputs.deploy_sha }}

  reconcile-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Resolve reconcile tag
        id: resolve
        env:
          TAG_NAME: ${{ inputs.reconcile_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a release tag such as v1.2.3."
            exit 1
          fi
          git fetch --tags origin
          RELEASE_SHA=$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check npm publication before reconciliation
        id: reconcile-publication
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          RELEASE_REVISION: ${{ steps.resolve.outputs.release_sha }}
          REQUIRE_UNPUBLISHED: 'true'
        run: *check-npm-publication

      - name: Reconcile release by opening rollback PR
        if: ${{ steps.reconcile-publication.outputs.published == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.release_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout master
          git reset --hard origin/master

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release delete "${TAG_NAME}" --yes
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG_NAME}"
          fi

          RELEASE_SHA="${RESOLVED_SHA}"
          TAG_SAFE="${TAG_NAME//./-}"
          TAG_SAFE="${TAG_SAFE//\//-}"
          BRANCH_NAME="ci/reconcile-${TAG_SAFE}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH_NAME}"

          if ! git revert --no-edit "${RELEASE_SHA}"; then
            git revert --abort || true
            git revert -m 1 --no-edit "${RELEASE_SHA}"
          fi

          git commit --amend -m "chore(ci): reconcile release ${TAG_NAME}"
          git push origin "${BRANCH_NAME}"

          PR_TITLE="chore(ci): reconcile release ${TAG_NAME}"
          PR_BODY=$(printf 'Reconcile workflow requested for %s in run https://github.com/%s/actions/runs/%s.\nThis PR reverts release commit %s after cleaning release metadata.\n' "${TAG_NAME}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${RELEASE_SHA}")

          PR_URL=""
          if ! PR_URL=$(gh pr create \
            --base master \
            --head "${BRANCH_NAME}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}"); then
            PR_URL=$(gh pr list \
              --head "${BRANCH_NAME}" \
              --base master \
              --state open \
              --json url \
              --jq '.[0].url // empty')
          fi

          if [ -z "${PR_URL}" ]; then
            echo "Failed to create or resolve reconcile PR."
            exit 1
          fi

          echo "Opened reconcile PR: ${PR_URL}"

          if ! gh pr merge "${PR_URL}" --auto --merge; then
            echo "Auto-merge could not be enabled. Merge reconcile PR manually."
          fi
